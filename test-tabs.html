<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pestañas</title>
    <style>
        .tab-container {
            margin: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            margin: 5px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 5px;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
        .content {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="tab-container">
        <h1>Test de Pestañas</h1>
        
        <button class="tab-btn active" onclick="testTab('pendiente', this)">⏳ Pendientes</button>
        <button class="tab-btn" onclick="testTab('aprobada', this)">✅ Aprobados</button>
        <button class="tab-btn" onclick="testTab('rechazada', this)">❌ Rechazados</button>
        <button class="tab-btn" onclick="testTab('todos', this)">👥 Todos</button>
        
        <div class="content" id="content">
            Contenido de: Pendientes
        </div>
    </div>

    <script>
        function testTab(status, buttonElement) {
            console.log('🔄 Cambiando a pestaña:', status);
            
            // Remover clase active de todos los botones
            const allButtons = document.querySelectorAll('.tab-btn');
            allButtons.forEach(btn => btn.classList.remove('active'));
            
            // Agregar clase active al botón clickeado
            buttonElement.classList.add('active');
            
            // Cambiar contenido
            const content = document.getElementById('content');
            content.textContent = `Contenido de: ${status}`;
            
            console.log('✅ Pestaña cambiada a:', status);
            alert('Pestaña funcionando: ' + status);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SLEP Iquique</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <a href="index.html" class="home-link">← Inicio</a>
    
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Sistema de acceso restringido - Solo usuarios autorizados</p>
                <div style="background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 8px; padding: 10px; margin: 10px 0; color: #856404;">
                    <strong>⚠️ Aviso:</strong> Este sistema solo permite acceso a usuarios autorizados previamente.
                </div>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                </div>
                
                <button type="submit" id="loginBtn" class="auth-btn">🔐 Iniciar Sesión</button>
            </form>
              <div class="register-link">
                ¿No tienes cuenta? <a href="registrar.html">Crear una cuenta</a>
            </div>
            
            <!-- TEMPORAL: Botón de debug -->
            <div style="margin-top: 20px; text-align: center;">
                <button type="button" onclick="clearStorage()" style="background: #ff4757; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">
                    🗑️ Limpiar Datos (Debug)
                </button>
            </div>

            <!-- Contenedor de alertas AQUÍ -->
            <div id="alertContainer"></div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Login page loaded');
            
            // Inicializar sistema con admin
            const adminUser = {
                username: 'francisco.ramos',
                email: 'francisco.ramos@slepiquique.cl',
                password: '', // Por seguridad, se configura dinámicamente
                status: 'admin'
            };
            
            const users = JSON.parse(localStorage.getItem('appUsers') || '[]');
            const adminExists = users.find(u => u.email === adminUser.email);
            if (!adminExists) {
                // Crear admin con contraseña segura inicial
                const secureAdmin = {
                    ...adminUser,
                    password: prompt('🔐 Configuración inicial: Establece la contraseña del administrador:') || 'temporal123'
                };
                users.push(secureAdmin);
                localStorage.setItem('appUsers', JSON.stringify(users));
                console.log('✅ Admin user created with secure password');
            } else {
                console.log('✅ Admin user already exists');
            }
            
            // Verificar si ya está logueado
            if (localStorage.getItem('currentUser')) {
                window.location.href = 'index.html';
                return;
            }
            
            // Verificar que el formulario existe
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            console.log('📋 Form element:', loginForm);
            console.log('🔘 Button element:', loginBtn);
            
            // Manejar el formulario de login
            if (loginForm) {
                console.log('✅ Adding event listener to form');
                loginForm.addEventListener('submit', function(e) {
                    console.log('🔥 Form submitted!');
                    e.preventDefault();
                
                // Mostrar indicador de carga
                const loginBtn = document.getElementById('loginBtn');
                const originalText = loginBtn.textContent;
                loginBtn.textContent = '⏳ Verificando...';
                loginBtn.disabled = true;
                
                // Simular un pequeño delay para mejor UX
                setTimeout(() => {
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;
                    
                    console.log('🔍 Datos ingresados:');
                    console.log('  Username:', username);
                    console.log('  Password:', password);
                    
                    // Función para restaurar el botón
                    function restoreButton() {
                        loginBtn.textContent = originalText;
                        loginBtn.disabled = false;
                    }
                    
                    if (!username || !password) {
                        alert('ERROR: Completa todos los campos');
                        showAlert('ERROR: Completa todos los campos', 'error');
                        restoreButton();
                        return;
                    }
                    
                    // Sistema de login con validación de estados
                    const users = JSON.parse(localStorage.getItem('appUsers') || '[]');
                    console.log('📊 Usuarios registrados:', users.length);
                    console.log('👥 Lista completa de usuarios:', users);
                    console.log('🔍 Buscando usuario:', username);
                    
                    const user = users.find(u => (u.username === username || u.email === username) && u.password === password);
                    console.log('👤 Usuario encontrado:', user);
                    
                    // Debug: Ver si el usuario existe pero con contraseña incorrecta
                    const userByUsernameOnly = users.find(u => u.username === username || u.email === username);
                    console.log('🔓 Usuario por nombre/email (sin verificar contraseña):', userByUsernameOnly);
                    
                    if (user) {
                        // Verificar estado del usuario
                        if (user.status === 'pendiente') {
                            alert('⏳ Cuenta pendiente de aprobación\n\nTu cuenta está siendo revisada por el administrador.');
                            showAlert('⏳ Cuenta pendiente de aprobación\n\nTu cuenta está siendo revisada por el administrador.', 'error');
                            restoreButton();
                            return;
                        }
                        
                        if (user.status === 'rechazada') {
                            alert('❌ Cuenta rechazada\n\nTu solicitud no fue aprobada. Contacta al administrador.');
                            showAlert('❌ Cuenta rechazada\n\nTu solicitud no fue aprobada. Contacta al administrador.', 'error');
                            restoreButton();
                            return;
                        }
                        
                        // Login exitoso para admin o usuarios aprobados
                        if (user.status === 'admin' || user.status === 'aprobada') {
                            const userSession = {
                                username: user.username,
                                email: user.email,
                                status: user.status,
                                loginTime: new Date().toISOString()
                            };
                            localStorage.setItem('currentUser', JSON.stringify(userSession));
                            
                            showAlert(`EXITO: Bienvenido ${user.username}!`, 'success');
                            
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 2000);
                        } else {
                            alert('🚫 Acceso denegado. Contacta al administrador.');
                            showAlert('🚫 Acceso denegado. Contacta al administrador.', 'error');
                            restoreButton();
                        }
                    } else {
                        alert('ERROR: Usuario o contraseña incorrectos');
                        showAlert('ERROR: Usuario o contraseña incorrectos', 'error');
                        restoreButton();
                    }
                }, 500); // Delay de 500ms para mostrar el indicador de carga
                });
            } else {
                console.log('❌ Login form not found!');
            }
        });
        
        // Función temporal para limpiar localStorage
        function clearStorage() {
            localStorage.removeItem('appUsers');
            localStorage.removeItem('currentUser');
            console.log('🗑️ LocalStorage limpiado');
            location.reload();
        }
        
        function showAlert(message, type = 'success') {
            console.log('showAlert llamada con:', message, type);
            
            const alertContainer = document.getElementById('alertContainer');
            console.log('alertContainer encontrado:', alertContainer);
            
            if (!alertContainer) {
                console.error('No se encontró alertContainer');
                return;
            }
            
            // Limpiar completamente
            alertContainer.innerHTML = '';
            console.log('Container limpiado');
            
            // Crear alerta SIMPLE
            const alertDiv = document.createElement('div');
            console.log('Div creado');
            
            // Estilo directo y simple
            if (type === 'error') {
                alertDiv.style.cssText = `
                    background: #ff4444 !important;
                    color: white !important;
                    padding: 20px !important;
                    margin: 15px 0 !important;
                    border-radius: 8px !important;
                    text-align: center !important;
                    font-size: 16px !important;
                    font-weight: bold !important;
                    border: 3px solid #cc0000 !important;
                    box-shadow: 0 4px 8px rgba(0,0,0,0.3) !important;
                    display: block !important;
                    width: 100% !important;
                    box-sizing: border-box !important;
                `;
                console.log('Estilo error aplicado');
            } else {
                alertDiv.style.cssText = `
                    background: #44aa44 !important;
                    color: white !important;
                    padding: 20px !important;
                    margin: 15px 0 !important;
                    border-radius: 8px !important;
                    text-align: center !important;
                    font-size: 16px !important;
                    font-weight: bold !important;
                    border: 3px solid #006600 !important;
                    box-shadow: 0 4px 8px rgba(0,0,0,0.3) !important;
                    display: block !important;
                    width: 100% !important;
                    box-sizing: border-box !important;
                `;
                console.log('Estilo success aplicado');
            }
            
            // Agregar el texto sin formato especial
            alertDiv.textContent = message;
            console.log('Texto agregado:', message);
            
            // Mostrar inmediatamente
            alertContainer.appendChild(alertDiv);
            console.log('Div agregado al container');
            
            // Verificar que se agregó
            console.log('Children del container:', alertContainer.children.length);
            
            // Auto-remover después de 5 segundos
            setTimeout(() => {
                if (alertDiv && alertDiv.parentNode) {
                    alertDiv.remove();
                    console.log('Alerta removida después de 5 segundos');
                }
            }, 5000);
        }
    </script>
    <!-- <script src="js/login.js"></script> -->
</body>
</html>

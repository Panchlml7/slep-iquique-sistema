# 🌐 CONFIGURACIÓN DEL SERVIDOR SLEP IQUIQUE
# Archivo de configuración para personalizar el servidor

[SERVIDOR]
# Puerto donde se ejecutará el servidor
PUERTO = 8080

# Host (0.0.0.0 = todas las interfaces, localhost = solo local)
HOST = 0.0.0.0

# Abrir automáticamente el navegador
ABRIR_NAVEGADOR = true

# Página de inicio por defecto
PAGINA_INICIO = index.html

[ACCESO]
# Estos son los accesos que estarán disponibles:
# - http://localhost:8080 (solo desde tu computadora)
# - http://TU_IP_LOCAL:8080 (desde la red local)
# - http://0.0.0.0:8080 (todas las interfaces)

[SEGURIDAD]
# El servidor incluye headers CORS para evitar errores
# No requiere configuración adicional para desarrollo

[INSTRUCCIONES]
# 1. Ejecutar: INICIAR-SERVIDOR.bat (Windows)
# 2. O ejecutar: python server.py (Manual)
# 3. El servidor mostrará todas las URLs disponibles
# 4. Usar Ctrl+C para detener el servidor

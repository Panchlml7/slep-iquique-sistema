<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - SLEP Iquique</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>📝 Registro de Usuario</h1>
                <p>Solicita acceso al sistema SLEP Iquique</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellidoPaterno">Apellido Paterno:</label>
                    <input type="text" id="apellidoPaterno" name="apellidoPaterno" required>
                </div>

                <div class="form-group">
                    <label for="apellidoMaterno">Apellido Materno:</label>
                    <input type="text" id="apellidoMaterno" name="apellidoMaterno" required>
                </div>

                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña:</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="establecimiento">Establecimiento:</label>
                    <select id="establecimiento" name="establecimiento" required>
                        <option value="">Seleccionar establecimiento</option>
                        <option value="Escuela Básica Los Aromos">Escuela Básica Los Aromos</option>
                        <option value="Liceo Técnico Industrial">Liceo Técnico Industrial</option>
                        <option value="Colegio San Patricio">Colegio San Patricio</option>
                        <option value="Escuela Rural Norte">Escuela Rural Norte</option>
                        <option value="Liceo Comercial">Liceo Comercial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cargo">Cargo:</label>
                    <select id="cargo" name="cargo" required>
                        <option value="">Seleccionar cargo</option>
                        <option value="Director(a)">Director(a)</option>
                        <option value="Subdirector(a)">Subdirector(a)</option>
                        <option value="Profesor(a)">Profesor(a)</option>
                        <option value="Inspector(a)">Inspector(a)</option>
                        <option value="Secretario(a)">Secretario(a)</option>
                        <option value="Auxiliar">Auxiliar</option>
                        <option value="Administrativo">Administrativo</option>
                    </select>
                </div>

                <button type="submit" class="auth-btn" id="registerBtn">
                    ✅ Crear Cuenta (Pendiente Aprobación)
                </button>

                <div class="auth-links">
                    <a href="login.html">¿Ya tienes cuenta? Iniciar sesión</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Sistema de registro iniciado');
            
            const registerForm = document.getElementById('registerForm');
            
            if (registerForm) {
                registerForm.addEventListener('submit', handleRegister);
                console.log('✅ Event listener agregado al formulario');
            } else {
                console.error('❌ No se encontró el formulario de registro');
            }
        });

        function handleRegister(event) {
            event.preventDefault();
            console.log('📝 Procesando registro...');
            
            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.textContent = '⏳ Procesando...';
            
            try {
                // Obtener datos del formulario
                const formData = new FormData(event.target);
                const userData = {
                    nombre: formData.get('nombre').trim(),
                    apellidoPaterno: formData.get('apellidoPaterno').trim(),
                    apellidoMaterno: formData.get('apellidoMaterno').trim(),
                    fechaNacimiento: formData.get('fechaNacimiento'),
                    username: formData.get('username').trim().toLowerCase(),
                    email: formData.get('email').trim().toLowerCase(),
                    password: formData.get('password'),
                    confirmPassword: formData.get('confirmPassword'),
                    establecimiento: formData.get('establecimiento'),
                    cargo: formData.get('cargo'),
                    status: 'pendiente',
                    registrationDate: new Date().toISOString()
                };
                
                console.log('📋 Datos del usuario:', userData);
                
                // Validaciones
                const validation = validateUserData(userData);
                if (!validation.isValid) {
                    alert('❌ ' + validation.message);
                    return;
                }
                
                // Verificar si el usuario ya existe
                const existingUsers = JSON.parse(localStorage.getItem('appUsers') || '[]');
                const userExists = existingUsers.some(user => 
                    user.username === userData.username || user.email === userData.email
                );
                
                if (userExists) {
                    alert('❌ El usuario o email ya están registrados');
                    return;
                }
                
                // Crear nombre completo
                userData.nombreCompleto = `${userData.nombre} ${userData.apellidoPaterno} ${userData.apellidoMaterno}`;
                
                // Remover confirmPassword antes de guardar
                delete userData.confirmPassword;
                
                // Guardar usuario
                existingUsers.push(userData);
                localStorage.setItem('appUsers', JSON.stringify(existingUsers));
                
                console.log('✅ Usuario registrado:', userData.username);
                
                // Mostrar mensaje de éxito
                alert(`✅ ¡Registro exitoso!

Tu cuenta ha sido creada con el usuario: ${userData.username}

Estado: Pendiente de aprobación por el administrador

Te contactaremos por email cuando tu cuenta sea aprobada.`);
                
                // Limpiar formulario
                document.getElementById('registerForm').reset();
                
                // Opcional: redirigir al login
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('❌ Error en registro:', error);
                alert('❌ Error al procesar el registro. Inténtalo nuevamente.');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = '✅ Crear Cuenta (Pendiente Aprobación)';
            }
        }

        function validateUserData(userData) {
            // Validar campos requeridos
            const requiredFields = ['nombre', 'apellidoPaterno', 'apellidoMaterno', 'username', 'email', 'password', 'establecimiento', 'cargo'];
            
            for (let field of requiredFields) {
                if (!userData[field] || userData[field].trim() === '') {
                    return {
                        isValid: false,
                        message: `El campo ${field} es requerido`
                    };
                }
            }
            
            // Validar username
            if (userData.username.length < 3) {
                return {
                    isValid: false,
                    message: 'El usuario debe tener al menos 3 caracteres'
                };
            }
            
            // Validar email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(userData.email)) {
                return {
                    isValid: false,
                    message: 'El email no tiene un formato válido'
                };
            }
            
            // Validar contraseña
            if (userData.password.length < 6) {
                return {
                    isValid: false,
                    message: 'La contraseña debe tener al menos 6 caracteres'
                };
            }
            
            // Validar confirmación de contraseña
            if (userData.password !== userData.confirmPassword) {
                return {
                    isValid: false,
                    message: 'Las contraseñas no coinciden'
                };
            }
            
            // Validar fecha de nacimiento
            if (userData.fechaNacimiento) {
                const birthDate = new Date(userData.fechaNacimiento);
                const today = new Date();
                const age = today.getFullYear() - birthDate.getFullYear();
                
                if (age < 18 || age > 80) {
                    return {
                        isValid: false,
                        message: 'La edad debe estar entre 18 y 80 años'
                    };
                }
            }
            
            return { isValid: true };
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const button = field.parentElement.querySelector('.toggle-password');
            
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = '🙈';
                button.title = 'Ocultar contraseña';
            } else {
                field.type = 'password';
                button.textContent = '👁️';
                button.title = 'Mostrar contraseña';
            }
        }
    </script>
</body>
</html>

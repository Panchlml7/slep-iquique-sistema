<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Demo - Detalle de Usuarios</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin: 0;
        }

        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .user-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #667eea;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
        }

        .user-avatar {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .user-name {
            color: #667eea;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
        }

        .user-status {
            padding: 6px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 8px;
            display: inline-block;
        }

        .status-pendiente {
            background: #fef3c7;
            color: #92400e;
        }

        .status-aprobada {
            background: #d1fae5;
            color: #065f46;
        }

        .status-rechazada {
            background: #fee2e2;
            color: #991b1b;
        }

        .user-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-section {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .detail-section h4 {
            margin: 0 0 15px 0;
            color: #374151;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-item {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-weight: bold;
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .detail-value {
            color: #374151;
            font-size: 1rem;
        }

        .password-section {
            grid-column: span 2;
            background: #fef3c7;
            border: 2px solid #fbbf24;
        }

        .password-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .password-display {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
            flex: 1;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .toggle-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: #2563eb;
        }

        .toggle-btn.showing {
            background: #ef4444;
        }

        .toggle-btn.showing:hover {
            background: #dc2626;
        }

        .actions {
            grid-column: span 2;
            text-align: center;
            margin-top: 15px;
        }

        .btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #059669;
        }

        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .user-grid {
                grid-template-columns: 1fr;
            }
            
            .user-details {
                grid-template-columns: 1fr;
            }
            
            .password-section {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Demostración: Detalle de Usuarios</h1>
            <p style="color: #6b7280; font-size: 1.1rem;">Vista completa de información de usuarios con contraseñas</p>
        </div>

        <div class="user-grid" id="usersContainer">
            <!-- Los usuarios se cargarán aquí -->
        </div>

        <div class="summary">
            <h2 style="margin: 0 0 15px 0;">📈 Estadísticas del Sistema</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total Usuarios</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingUsers">0</div>
                    <div class="stat-label">⏳ Pendientes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="approvedUsers">0</div>
                    <div class="stat-label">✅ Aprobados</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="rejectedUsers">0</div>
                    <div class="stat-label">❌ Rechazados</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de ejemplo completos
        const usuariosEjemplo = [
            {
                username: 'carlos.rodriguez',
                email: 'carlos.rodriguez@slepiquique.cl',
                password: 'carlos456',
                nombre: 'Carlos',
                apellidoPaterno: 'Rodríguez',
                apellidoMaterno: 'Mendoza',
                nombreCompleto: 'Carlos Rodríguez Mendoza',
                establecimiento: 'Escuela Básica Salvador Allende',
                cargo: 'Director',
                status: 'aprobada',
                telefono: '+56 9 1234 5678',
                rut: '11.222.333-4',
                registrationDate: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString(),
                fechaAprobacion: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString(),
                aprobadoPor: 'Francisco Ramos'
            },
            {
                username: 'ana.martinez',
                email: 'ana.martinez@slepiquique.cl',
                password: 'ana789',
                nombre: 'Ana',
                apellidoPaterno: 'Martínez',
                apellidoMaterno: 'López',
                nombreCompleto: 'Ana Martínez López',
                establecimiento: 'Jardín Infantil Los Pequeños',
                cargo: 'Educadora de Párvulos',
                status: 'aprobada',
                telefono: '+56 9 9876 5432',
                rut: '15.678.901-2',
                registrationDate: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString(),
                fechaAprobacion: new Date(Date.now() - 4 * 24 * 60 * 60 * 1000).toISOString(),
                aprobadoPor: 'Francisco Ramos'
            },
            {
                username: 'pedro.sanchez',
                email: 'pedro.sanchez@slepiquique.cl',
                password: 'pedro2024',
                nombre: 'Pedro',
                apellidoPaterno: 'Sánchez',
                apellidoMaterno: 'Herrera',
                nombreCompleto: 'Pedro Sánchez Herrera',
                establecimiento: 'Colegio Arturo Prat',
                cargo: 'Profesor de Historia',
                status: 'rechazada',
                telefono: '+56 9 5555 1234',
                rut: '18.765.432-1',
                registrationDate: new Date(Date.now() - 10 * 24 * 60 * 60 * 1000).toISOString(),
                fechaRechazo: new Date(Date.now() - 8 * 24 * 60 * 60 * 1000).toISOString(),
                rechazadoPor: 'Francisco Ramos',
                motivoRechazo: 'Documentación incompleta'
            },
            {
                username: 'lucia.torres',
                email: 'lucia.torres@slepiquique.cl',
                password: 'lucia555',
                nombre: 'Lucía',
                apellidoPaterno: 'Torres',
                apellidoMaterno: 'Vargas',
                nombreCompleto: 'Lucía Torres Vargas',
                establecimiento: 'Liceo Bicentenario',
                cargo: 'Psicóloga Educacional',
                status: 'pendiente',
                telefono: '+56 9 3333 7777',
                rut: '19.876.543-2',
                registrationDate: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000).toISOString()
            },
            {
                username: 'miguel.castro',
                email: 'miguel.castro@slepiquique.cl',
                password: 'miguel888',
                nombre: 'Miguel',
                apellidoPaterno: 'Castro',
                apellidoMaterno: 'Ramírez',
                nombreCompleto: 'Miguel Castro Ramírez',
                establecimiento: 'Escuela Rural El Tamarugal',
                cargo: 'Encargado de Convivencia',
                status: 'aprobada',
                telefono: '+56 9 4444 8888',
                rut: '16.543.210-9',
                registrationDate: new Date(Date.now() - 6 * 24 * 60 * 60 * 1000).toISOString(),
                fechaAprobacion: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString(),
                aprobadoPor: 'Francisco Ramos'
            }
        ];

        // Función para alternar contraseña
        function togglePassword(username) {
            const passwordDisplay = document.getElementById(`password_${username}`);
            const toggleBtn = document.getElementById(`toggle_${username}`);
            const user = usuariosEjemplo.find(u => u.username === username);

            if (passwordDisplay.textContent === '••••••••') {
                passwordDisplay.textContent = user.password;
                passwordDisplay.style.background = '#fef3c7';
                passwordDisplay.style.color = '#92400e';
                passwordDisplay.style.borderColor = '#fbbf24';
                toggleBtn.textContent = '🙈 Ocultar';
                toggleBtn.classList.add('showing');
            } else {
                passwordDisplay.textContent = '••••••••';
                passwordDisplay.style.background = 'white';
                passwordDisplay.style.color = '#374151';
                passwordDisplay.style.borderColor = '#e5e7eb';
                toggleBtn.textContent = '👁️ Mostrar';
                toggleBtn.classList.remove('showing');
            }
        }

        // Función para copiar información
        function copyUserInfo(username) {
            const user = usuariosEjemplo.find(u => u.username === username);
            const info = `INFORMACIÓN DETALLADA DEL USUARIO

👤 DATOS PERSONALES:
• Nombre Completo: ${user.nombreCompleto}
• Usuario: ${user.username}
• Email: ${user.email}
• RUT: ${user.rut}
• Teléfono: ${user.telefono}

🔐 ACCESO:
• Contraseña: ${user.password}
• Estado: ${user.status}

🏢 INFORMACIÓN PROFESIONAL:
• Establecimiento: ${user.establecimiento}
• Cargo: ${user.cargo}

📅 FECHAS:
• Registro: ${new Date(user.registrationDate).toLocaleString('es-CL')}
${user.fechaAprobacion ? `• Aprobación: ${new Date(user.fechaAprobacion).toLocaleString('es-CL')}` : ''}
${user.fechaRechazo ? `• Rechazo: ${new Date(user.fechaRechazo).toLocaleString('es-CL')}` : ''}

Generado: ${new Date().toLocaleString('es-CL')}`;

            navigator.clipboard.writeText(info).then(() => {
                alert('📋 Información copiada al portapapeles exitosamente');
            }).catch(() => {
                prompt('📋 Copia esta información:', info);
            });
        }

        // Función para formatear fechas
        function formatDate(dateString) {
            if (!dateString) return 'No disponible';
            return new Date(dateString).toLocaleString('es-CL', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Función para obtener ícono de estado
        function getStatusIcon(status) {
            const icons = {
                'pendiente': '⏳',
                'aprobada': '✅',
                'rechazada': '❌'
            };
            return icons[status] || '❓';
        }

        // Renderizar usuarios
        function renderUsers() {
            const container = document.getElementById('usersContainer');
            
            const usersHTML = usuariosEjemplo.map(user => `
                <div class="user-card">
                    <div class="user-header">
                        <div class="user-avatar">👤</div>
                        <h3 class="user-name">${user.nombreCompleto}</h3>
                        <div class="user-status status-${user.status}">
                            ${getStatusIcon(user.status)} ${user.status.charAt(0).toUpperCase() + user.status.slice(1)}
                        </div>
                    </div>

                    <div class="user-details">
                        <!-- Datos Personales -->
                        <div class="detail-section">
                            <h4><span style="font-size: 1.2rem;">👤</span> Datos Personales</h4>
                            <div class="detail-item">
                                <div class="detail-label">Usuario:</div>
                                <div class="detail-value"><code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">${user.username}</code></div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Email:</div>
                                <div class="detail-value" style="color: #3b82f6;">${user.email}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">RUT:</div>
                                <div class="detail-value">${user.rut}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Teléfono:</div>
                                <div class="detail-value">${user.telefono}</div>
                            </div>
                        </div>

                        <!-- Información Profesional -->
                        <div class="detail-section">
                            <h4><span style="font-size: 1.2rem;">🏢</span> Información Profesional</h4>
                            <div class="detail-item">
                                <div class="detail-label">Establecimiento:</div>
                                <div class="detail-value">${user.establecimiento}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Cargo:</div>
                                <div class="detail-value">${user.cargo}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Fecha de Registro:</div>
                                <div class="detail-value">${formatDate(user.registrationDate)}</div>
                            </div>
                            ${user.fechaAprobacion ? `
                            <div class="detail-item">
                                <div class="detail-label">Fecha de Aprobación:</div>
                                <div class="detail-value" style="color: #059669;">${formatDate(user.fechaAprobacion)}</div>
                            </div>
                            ` : ''}
                            ${user.fechaRechazo ? `
                            <div class="detail-item">
                                <div class="detail-label">Fecha de Rechazo:</div>
                                <div class="detail-value" style="color: #dc2626;">${formatDate(user.fechaRechazo)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Motivo:</div>
                                <div class="detail-value" style="color: #dc2626;">${user.motivoRechazo}</div>
                            </div>
                            ` : ''}
                        </div>

                        <!-- Contraseña -->
                        <div class="detail-section password-section">
                            <h4><span style="font-size: 1.2rem;">🔐</span> Información Confidencial</h4>
                            <div class="detail-label">Contraseña:</div>
                            <div class="password-container">
                                <div class="password-display" id="password_${user.username}">••••••••</div>
                                <button class="toggle-btn" id="toggle_${user.username}" onclick="togglePassword('${user.username}')">
                                    👁️ Mostrar
                                </button>
                            </div>
                        </div>

                        <!-- Acciones -->
                        <div class="actions">
                            <button class="btn" onclick="copyUserInfo('${user.username}')">
                                📋 Copiar Información
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = usersHTML;

            // Actualizar estadísticas
            const stats = {
                total: usuariosEjemplo.length,
                pendientes: usuariosEjemplo.filter(u => u.status === 'pendiente').length,
                aprobados: usuariosEjemplo.filter(u => u.status === 'aprobada').length,
                rechazados: usuariosEjemplo.filter(u => u.status === 'rechazada').length
            };

            document.getElementById('totalUsers').textContent = stats.total;
            document.getElementById('pendingUsers').textContent = stats.pendientes;
            document.getElementById('approvedUsers').textContent = stats.aprobados;
            document.getElementById('rejectedUsers').textContent = stats.rechazados;
        }

        // Inicializar cuando cargue la página
        document.addEventListener('DOMContentLoaded', renderUsers);
    </script>
</body>
</html>
